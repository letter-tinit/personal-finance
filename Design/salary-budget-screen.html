<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salary Budget Screen</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --surface: #ffffff;
      --text: #1b211d;
      --muted: #647069;
      --border: #dde3dd;
      --accent: #0f7f68;
      --needs: #9b6819;
      --wants: #286b8f;
      --savings: #0f7f68;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .phone {
      width: min(100%, 390px);
      min-height: 780px;
      background: var(--bg);
      border: 12px solid #141814;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(27, 33, 29, 0.16);
    }

    .status {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      font-size: 12px;
      font-weight: 700;
    }

    .dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: var(--text);
      opacity: 0.75;
    }

    .battery {
      width: 22px;
      height: 10px;
      border: 1.5px solid var(--text);
      border-radius: 3px;
      position: relative;
      margin-left: 3px;
    }

    .battery::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 13px;
      height: 4px;
      background: var(--text);
      border-radius: 1px;
    }

    main {
      padding: 20px 18px 28px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 6px;
    }

    .salary {
      font-size: 30px;
      line-height: 1;
      font-weight: 760;
      letter-spacing: 0;
      margin-bottom: 14px;
    }

    .method {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      font-size: 14px;
    }

    .pill {
      background: #dcefe9;
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .bucket-list {
      display: grid;
      gap: 10px;
    }

    .bucket {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    .bucket-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .bucket-name {
      font-size: 16px;
      font-weight: 750;
    }

    .ratio {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .amount {
      font-size: 22px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .bar-track {
      height: 8px;
      background: #edf0ec;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }

    .bar {
      height: 100%;
      border-radius: inherit;
    }

    .needs .bar {
      width: 50%;
      background: var(--needs);
    }

    .wants .bar {
      width: 30%;
      background: var(--wants);
    }

    .savings .bar {
      width: 20%;
      background: var(--savings);
    }

    @media (max-width: 460px) {
      body {
        padding: 0;
      }

      .phone {
        width: 100%;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status">
      <span>9:41</span>
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="battery"></span>
      </div>
    </div>

    <main>
      <h1>Salary Budget</h1>
      <p class="subtitle">Static preview for Task 2</p>

      <section class="summary">
        <p class="label">Monthly salary</p>
        <div class="salary">16,000,000 VND</div>
        <div class="method">
          <span>Budget method</span>
          <span class="pill">50/30/20</span>
        </div>
      </section>

      <div class="section-title">
        <h2>Budget Buckets</h2>
        <span>calculated</span>
      </div>

      <section class="bucket-list">
        <div class="bucket needs">
          <div class="bucket-head">
            <span class="bucket-name">Needs</span>
            <span class="ratio">50%</span>
          </div>
          <div class="amount">8,000,000 VND</div>
          <div class="bar-track"><div class="bar"></div></div>
        </div>

        <div class="bucket wants">
          <div class="bucket-head">
            <span class="bucket-name">Wants</span>
            <span class="ratio">30%</span>
          </div>
          <div class="amount">4,800,000 VND</div>
          <div class="bar-track"><div class="bar"></div></div>
        </div>

        <div class="bucket savings">
          <div class="bucket-head">
            <span class="bucket-name">Savings</span>
            <span class="ratio">20%</span>
          </div>
          <div class="amount">3,200,000 VND</div>
          <div class="bar-track"><div class="bar"></div></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
