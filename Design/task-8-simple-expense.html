<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 8 - Create Expense Transactions</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --surface: #ffffff;
      --text: #1b211d;
      --muted: #647069;
      --border: #dde3dd;
      --accent: #0f7f68;
      --track: #edf0ec;
      --needs: #286b8f;
      --wants: #c07318;
      --savings: #0f7f68;
      --freedom: #15947f;
      --education: #7254a3;
      --play: #b64e7d;
      --give: #308978;
      --danger: #b54733;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .phone {
      width: min(100%, 390px);
      min-height: 820px;
      background: var(--bg);
      border: 12px solid #141814;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(27, 33, 29, 0.16);
    }

    .status {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      font-size: 12px;
      font-weight: 700;
    }

    .battery {
      width: 22px;
      height: 10px;
      border: 1.5px solid var(--text);
      border-radius: 3px;
      position: relative;
    }

    .battery::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 13px;
      height: 4px;
      background: var(--text);
      border-radius: 1px;
    }

    main {
      padding: 20px 18px 30px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 32px;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .card,
    .bucket,
    .transaction-row,
    .empty-state {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .card {
      padding: 16px;
      margin-bottom: 16px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 6px;
    }

    .input-large,
    .input-normal,
    select {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      letter-spacing: 0;
    }

    .input-large {
      margin: 0 0 14px;
      font-size: 30px;
      line-height: 1;
      font-weight: 760;
    }

    .input-normal,
    select {
      min-height: 36px;
      font-size: 18px;
      font-weight: 700;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 10px 0 14px;
    }

    .method-head,
    .transaction-head,
    .section-title,
    .bucket-head,
    .transaction-main,
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .method-head {
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 650;
    }

    .method-pill {
      color: var(--accent);
      background: #dcefe9;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: #e8ece7;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }

    .segment {
      border: 0;
      border-radius: 6px;
      min-height: 32px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
    }

    .segment.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(27, 33, 29, 0.12);
    }

    .transaction-head {
      margin-bottom: 14px;
    }

    .transaction-head h2,
    .section-title h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .add-button {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      margin-top: 14px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 760;
      cursor: pointer;
    }

    .section-title {
      margin: 4px 0 10px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .bucket-list,
    .transaction-list {
      display: grid;
      gap: 10px;
    }

    .bucket {
      padding: 14px;
    }

    .bucket-head {
      margin-bottom: 10px;
    }

    .bucket-name {
      font-size: 16px;
      font-weight: 760;
    }

    .ratio {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .row {
      min-height: 24px;
      font-size: 13px;
    }

    .row span:first-child {
      color: var(--muted);
    }

    .row strong {
      font-size: 14px;
      font-weight: 760;
    }

    .negative {
      color: var(--danger);
    }

    .transaction-row {
      padding: 12px 14px;
    }

    .transaction-main {
      align-items: flex-start;
    }

    .transaction-label {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .transaction-bucket {
      font-size: 15px;
      font-weight: 760;
    }

    .transaction-note,
    .empty-state {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .transaction-amount {
      flex: 0 0 auto;
      font-size: 15px;
      font-weight: 760;
      text-align: right;
      white-space: nowrap;
    }

    .empty-state {
      padding: 14px;
      text-align: center;
    }

    .bar-track {
      height: 8px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }

    .bar {
      height: 100%;
      border-radius: inherit;
    }

    @media (max-width: 460px) {
      body {
        padding: 0;
      }

      .phone {
        width: 100%;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status">
      <span>9:41</span>
      <span class="battery"></span>
    </div>

    <main>
      <h1>Salary Budget</h1>

      <section class="card">
        <p class="label">Monthly salary</p>
        <input class="input-large" id="salary" value="16000000" inputmode="numeric" aria-label="Monthly salary" readonly aria-readonly="true">

        <div class="divider"></div>

        <div class="method-head">
          <span>Active budget method</span>
          <span class="method-pill" id="method-pill">50/30/20</span>
        </div>
      </section>

      <section class="card">
        <div class="transaction-head">
          <h2>New Transaction</h2>
          <span class="method-pill" id="transaction-pill">Wants</span>
        </div>

        <p class="label">Amount</p>
        <input class="input-normal" id="transaction-amount" value="700000" inputmode="numeric" aria-label="Transaction amount">

        <div class="divider"></div>

        <p class="label">Bucket</p>
        <select id="transaction-bucket" aria-label="Transaction bucket"></select>

        <div class="divider"></div>

        <p class="label">Note</p>
        <input class="input-normal" id="transaction-note" value="Give family" aria-label="Transaction note">

        <button class="add-button" type="button" id="add-transaction">Add Transaction</button>
      </section>

      <div class="section-title">
        <h2>Budget Buckets</h2>
        <span id="bucket-count">3 buckets</span>
      </div>

      <section class="bucket-list" id="bucket-list"></section>

      <div class="section-title" style="margin-top: 18px;">
        <h2>Transactions</h2>
        <span id="transaction-count">2 transactions</span>
      </div>

      <section class="transaction-list" id="transaction-list"></section>
    </main>
  </div>

  <script>
    const methods = {
      fifty: {
        label: "50/30/20",
        buckets: [
          { id: "needs", name: "Needs", ratio: 0.5, color: "var(--needs)" },
          { id: "wants", name: "Wants", ratio: 0.3, color: "var(--wants)" },
          { id: "savings", name: "Savings", ratio: 0.2, color: "var(--savings)" }
        ]
      },
      jars: {
        label: "6 Jars",
        buckets: [
          { id: "necessities", name: "Necessities", ratio: 0.55, color: "var(--needs)" },
          { id: "financialFreedom", name: "Financial Freedom", ratio: 0.1, color: "var(--freedom)" },
          { id: "education", name: "Education", ratio: 0.1, color: "var(--education)" },
          { id: "longTermSavings", name: "Long-term Savings", ratio: 0.1, color: "var(--savings)" },
          { id: "play", name: "Play", ratio: 0.1, color: "var(--play)" },
          { id: "give", name: "Give", ratio: 0.05, color: "var(--give)" }
        ]
      }
    };

    const salaryInput = document.querySelector("#salary");
    const transactionAmountInput = document.querySelector("#transaction-amount");
    const transactionNoteInput = document.querySelector("#transaction-note");
    const bucketSelect = document.querySelector("#transaction-bucket");
    const addTransactionButton = document.querySelector("#add-transaction");
    const bucketList = document.querySelector("#bucket-list");
    const transactionList = document.querySelector("#transaction-list");
    const methodPill = document.querySelector("#method-pill");
    const transactionPill = document.querySelector("#transaction-pill");
    const bucketCount = document.querySelector("#bucket-count");
    const transactionCount = document.querySelector("#transaction-count");
    let selectedMethod = "fifty";
    let selectedBucketId = "wants";
    let transactions = [
      { id: 2, bucketId: "needs", amount: 300000, note: "Living expenses" },
      { id: 1, bucketId: "wants", amount: 700000, note: "Give family" }
    ];
    let nextTransactionId = 3;

    function parseMoney(input) {
      const numericText = input.value.replace(/[^0-9]/g, "");
      return Number(numericText || 0);
    }

    function formatMoney(value) {
      return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(value);
    }

    function currentBuckets() {
      return methods[selectedMethod].buckets;
    }

    function syncBucketSelection() {
      const buckets = currentBuckets();
      if (!buckets.some((bucket) => bucket.id === selectedBucketId)) {
        selectedBucketId = buckets[0].id;
      }

      bucketSelect.innerHTML = buckets.map((bucket) => {
        const selected = bucket.id === selectedBucketId ? "selected" : "";
        return `<option value="${bucket.id}" ${selected}>${bucket.name}</option>`;
      }).join("");
    }

    function render() {
      syncBucketSelection();

      const method = methods[selectedMethod];
      const salary = parseMoney(salaryInput);
      const selectedBucket = method.buckets.find((bucket) => bucket.id === selectedBucketId);

      methodPill.textContent = method.label;
      transactionPill.textContent = selectedBucket.name;
      bucketCount.textContent = `${method.buckets.length} buckets`;
      transactionCount.textContent = transactions.length === 1
        ? "1 transaction"
        : `${transactions.length} transactions`;

      bucketList.innerHTML = method.buckets.map((bucket) => {
        const target = salary * bucket.ratio;
        const spent = transactions
          .filter((transaction) => transaction.bucketId === bucket.id)
          .reduce((total, transaction) => total + transaction.amount, 0);
        const remaining = target - spent;
        const remainingClass = remaining < 0 ? "negative" : "";
        const progress = target <= 0 ? 0 : Math.max(0, Math.min(100, (remaining / target) * 100));
        return `
          <article class="bucket">
            <div class="bucket-head">
              <span class="bucket-name">${bucket.name}</span>
              <span class="ratio">${Math.round(bucket.ratio * 100)}%</span>
            </div>
            <div class="row">
              <span>Target</span>
              <strong>${formatMoney(target)}</strong>
            </div>
            <div class="row">
              <span>Spent</span>
              <strong>${formatMoney(spent)}</strong>
            </div>
            <div class="row">
              <span>Remaining</span>
              <strong class="${remainingClass}">${formatMoney(remaining)}</strong>
            </div>
            <div class="bar-track">
              <div class="bar" style="width: ${progress}%; background: ${bucket.color};"></div>
            </div>
          </article>
        `;
      }).join("");

      if (transactions.length === 0) {
        transactionList.innerHTML = `<div class="empty-state">No transactions yet</div>`;
      } else {
        transactionList.innerHTML = transactions.map((transaction) => {
          const bucket = method.buckets.find((item) => item.id === transaction.bucketId);
          const note = transaction.note.trim();
          const label = note || bucket.name;
          const secondLine = note ? `<span class="transaction-note">${note}</span>` : "";
          return `
            <article class="transaction-row">
              <div class="transaction-main">
                <div class="transaction-label">
                  <span class="transaction-bucket">${bucket.name}</span>
                  ${secondLine}
                </div>
                <span class="transaction-amount">${formatMoney(transaction.amount)}</span>
              </div>
            </article>
          `;
        }).join("");
      }
    }

    bucketSelect.addEventListener("change", () => {
      selectedBucketId = bucketSelect.value;
      render();
    });

    addTransactionButton.addEventListener("click", () => {
      const amount = parseMoney(transactionAmountInput);
      if (amount <= 0) {
        return;
      }

      transactions.unshift({
        id: nextTransactionId,
        bucketId: selectedBucketId,
        amount,
        note: transactionNoteInput.value.trim()
      });
      nextTransactionId += 1;
      transactionAmountInput.value = "";
      transactionNoteInput.value = "";
      render();
    });

    render();
  </script>
</body>
</html>
