<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 6 - Choose Budget Method</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --surface: #ffffff;
      --text: #1b211d;
      --muted: #647069;
      --border: #dde3dd;
      --accent: #0f7f68;
      --track: #edf0ec;
      --needs: #286b8f;
      --wants: #c07318;
      --savings: #0f7f68;
      --freedom: #15947f;
      --education: #7254a3;
      --play: #b64e7d;
      --give: #308978;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .phone {
      width: min(100%, 390px);
      min-height: 780px;
      background: var(--bg);
      border: 12px solid #141814;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(27, 33, 29, 0.16);
    }

    .status {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      font-size: 12px;
      font-weight: 700;
    }

    .battery {
      width: 22px;
      height: 10px;
      border: 1.5px solid var(--text);
      border-radius: 3px;
      position: relative;
    }

    .battery::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 13px;
      height: 4px;
      background: var(--text);
      border-radius: 1px;
    }

    main {
      padding: 20px 18px 28px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 32px;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .summary,
    .bucket {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .summary {
      padding: 16px;
      margin-bottom: 18px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 6px;
    }

    .salary {
      width: 100%;
      border: 0;
      outline: 0;
      padding: 0;
      margin: 0 0 14px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 30px;
      line-height: 1;
      font-weight: 760;
      letter-spacing: 0;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 10px 0 14px;
    }

    .method-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 650;
    }

    .method-pill {
      color: var(--accent);
      background: #dcefe9;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 750;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: #e8ece7;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }

    .segment {
      border: 0;
      border-radius: 6px;
      min-height: 32px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
    }

    .segment.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(27, 33, 29, 0.12);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .bucket-list {
      display: grid;
      gap: 10px;
    }

    .bucket {
      padding: 14px;
    }

    .bucket-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 9px;
    }

    .bucket-name {
      font-size: 16px;
      font-weight: 760;
    }

    .ratio {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .amount {
      font-size: 22px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .bar-track {
      height: 8px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }

    .bar {
      height: 100%;
      border-radius: inherit;
    }

    @media (max-width: 460px) {
      body {
        padding: 0;
      }

      .phone {
        width: 100%;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status">
      <span>9:41</span>
      <span class="battery"></span>
    </div>

    <main>
      <h1>Salary Budget</h1>

      <section class="summary">
        <p class="label">Monthly salary</p>
        <input class="salary" id="salary" value="16000000" inputmode="numeric" aria-label="Monthly salary">

        <div class="divider"></div>

        <div class="method-head">
          <span>Budget Method</span>
          <span class="method-pill" id="method-pill">50/30/20</span>
        </div>

        <div class="segmented" aria-label="Budget method">
          <button class="segment active" type="button" data-method="fifty">50/30/20</button>
          <button class="segment" type="button" data-method="jars">6 Jars</button>
        </div>
      </section>

      <div class="section-title">
        <h2>Budget Buckets</h2>
        <span id="bucket-count">3 buckets</span>
      </div>

      <section class="bucket-list" id="bucket-list"></section>
    </main>
  </div>

  <script>
    const methods = {
      fifty: {
        label: "50/30/20",
        buckets: [
          { name: "Needs", ratio: 0.5, color: "var(--needs)" },
          { name: "Wants", ratio: 0.3, color: "var(--wants)" },
          { name: "Savings", ratio: 0.2, color: "var(--savings)" }
        ]
      },
      jars: {
        label: "6 Jars",
        buckets: [
          { name: "Necessities", ratio: 0.55, color: "var(--needs)" },
          { name: "Financial Freedom", ratio: 0.1, color: "var(--freedom)" },
          { name: "Education", ratio: 0.1, color: "var(--education)" },
          { name: "Long-term Savings", ratio: 0.1, color: "var(--savings)" },
          { name: "Play", ratio: 0.1, color: "var(--play)" },
          { name: "Give", ratio: 0.05, color: "var(--give)" }
        ]
      }
    };

    const salaryInput = document.querySelector("#salary");
    const bucketList = document.querySelector("#bucket-list");
    const methodPill = document.querySelector("#method-pill");
    const bucketCount = document.querySelector("#bucket-count");
    let selectedMethod = "fifty";

    function parseSalary() {
      const numericText = salaryInput.value.replace(/[^0-9]/g, "");
      return Number(numericText || 0);
    }

    function formatMoney(value) {
      return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(value);
    }

    function render() {
      const method = methods[selectedMethod];
      const salary = parseSalary();
      methodPill.textContent = method.label;
      bucketCount.textContent = `${method.buckets.length} buckets`;
      bucketList.innerHTML = method.buckets.map((bucket) => {
        const percent = Math.round(bucket.ratio * 100);
        const amount = salary * bucket.ratio;
        return `
          <article class="bucket">
            <div class="bucket-head">
              <span class="bucket-name">${bucket.name}</span>
              <span class="ratio">${percent}%</span>
            </div>
            <div class="amount">${formatMoney(amount)}</div>
            <div class="bar-track">
              <div class="bar" style="width: ${percent}%; background: ${bucket.color};"></div>
            </div>
          </article>
        `;
      }).join("");
    }

    document.querySelectorAll(".segment").forEach((button) => {
      button.addEventListener("click", () => {
        selectedMethod = button.dataset.method;
        document.querySelectorAll(".segment").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        render();
      });
    });

    salaryInput.addEventListener("input", render);
    render();
  </script>
</body>
</html>
